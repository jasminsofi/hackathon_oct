<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Campuslands</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

    <div class="container mt-4">

        <h1 class="text-center mb-4">
            Sistema Central de Gestión Operativa
        </h1>

        <h2>Espacios Disponibles</h2>

        <table class="table table-striped table-hover">

            <thead class="table-dark">
                <tr>
                    <th>Nombre</th>
                    <th>Capacidad</th>
                    <th>Estado</th>
                </tr>
            </thead>

            <tbody>

                {% for aula in aulas %}

                <tr>
                    <td>{{ aula.nombre }}</td>
                    <td>{{ aula.capacidad }}</td>
                    <td>
                        <span class="badge bg-success">
                            {{ aula.estado }}
                        </span>
                    </td>
                </tr>

                {% endfor %}

            </tbody>

        </table>

        <div class="card shadow">

            <div class="card-header">
                Reservar espacio
            </div>

            <div class="card-body">

                <form method="POST" action="/reservar">

                    <div class="mb-3">

                        <label class="form-label">
                            Espacio
                        </label>

                        <select name="aula_id" class="form-select" required>

                            {% for aula in aulas %}

                            <option value="{{ aula.id }}">
                                {{ aula.nombre }} ({{ aula.capacidad }} personas)
                            </option>

                            {% endfor %}

                        </select>
                        <div class="mb-3">

                            <label class="form-label">
                                Número de asistentes
                            </label>

                            <input type="number" name="asistentes" class="form-control" required>

                        </div>

                        <button type="submit" class="btn btn-primary">
                            Reservar
                        </button>

                </form>

            </div>

        </div>

    </div>

</body>

</html>
