<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Campuslands</title>
</head>
<body>

    <h1>Sistema Central Campuslands</h1>

    <h2>Espacios disponibles</h2>

    <table border="1">

        <tr>
            <th>Nombre</th>
            <th>Capacidad</th>
            <th>Estado</th>
        </tr>

        {% for aula in aulas %}
        <tr>
            <td>{{ aula.nombre }}</td>
            <td>{{ aula.capacidad }}</td>
            <td>{{ aula.estado }}</td>
        </tr>
        {% endfor %}

    </table>

</body>
</html>
